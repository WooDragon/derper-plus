name: Build and publish derper image

on:
  pull_request:
    branches:
      - stable
  push:
    branches:
      - stable
    tags:
      - "v*-plus.*"
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'WooDragon/derper-plus' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build both target platforms
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: cmd/derper/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

  publish:
    if: >-
      github.repository == 'WooDragon/derper-plus' &&
      (github.ref == 'refs/heads/stable' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    concurrency:
      group: derper-image-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out publication source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record checked-out source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate publication ref
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -eu
          git fetch origin refs/heads/stable:refs/remotes/origin/stable
          stable_head="$(git rev-parse refs/remotes/origin/stable)"
          checkout_head="$(git rev-parse HEAD)"

          if [ "$checkout_head" != "$EVENT_SHA" ]; then
            echo "checked-out revision does not match the event SHA" >&2
            exit 1
          fi

          if [ "$REF" = "refs/heads/stable" ]; then
            if [ "$checkout_head" != "$stable_head" ]; then
              echo "Skipping stale stable event: $checkout_head is behind $stable_head"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ "$EVENT_NAME" = "push" ] && printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-plus\.[0-9]+$'; then
            git merge-base --is-ancestor "$checkout_head" refs/remotes/origin/stable
          else
            echo "ref is not an allowed stable publication or release tag" >&2
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: steps.validate.outputs.publish == 'true'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Generate image metadata
        if: steps.validate.outputs.publish == 'true'
        id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/woodragon/derper-plus
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/stable' }}
            type=raw,value=sha-${{ steps.source.outputs.revision }},enable=${{ github.ref == 'refs/heads/stable' }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=sha-${{ steps.source.outputs.revision }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.source=https://github.com/WooDragon/derper-plus
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=BSD-3-Clause
      - name: Log in to GitHub Container Registry
        if: steps.validate.outputs.publish == 'true'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish both target platforms
        if: steps.validate.outputs.publish == 'true'
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: cmd/derper/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Record immutable image digest
        if: steps.validate.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Published derper image"
            echo
            echo "- Source revision: \\`${{ steps.source.outputs.revision }}\\`"
            echo "- Digest: \\`$DIGEST\\`"
          } >> "$GITHUB_STEP_SUMMARY"
